name: Fetch YouTube Transcript

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'YouTube video ID'
        required: true
        default: '2VmjCxXBW-c'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install youtube-transcript-api "requests[socks]" PySocks
      - name: Fetch transcript via Webshare
        run: |
          cat > fetch.py << 'PYEOF'
          from youtube_transcript_api import YouTubeTranscriptApi
          from youtube_transcript_api.proxies import WebshareProxyConfig
          import sys

          vid = sys.argv[1]
          try:
              config = WebshareProxyConfig(
                  proxy_username="islzhoxm",
                  proxy_password="icrjm8r2wyc6",
              )
              api = YouTubeTranscriptApi(proxy_config=config)
              transcript_list = api.list(vid)
              import time
              last_err = None
              t = None
              for attempt in range(4):
                  try:
                      try:
                          tt = transcript_list.find_transcript(['en'])
                      except Exception:
                          tt = transcript_list.find_transcript(['hi'])
                      t = tt.fetch()
                      break
                  except Exception as e:
                      last_err = e
                      time.sleep(15 * (attempt + 1))
              if t is None:
                  raise last_err
              result = "\n".join(s.text for s in t)
              with open("transcript_output.txt", "w") as f:
                  f.write(result)
              print("SUCCESS, lines:", len(result.splitlines()))
          except Exception as e:
              with open("transcript_output.txt", "w") as f:
                  f.write(f"WEBSHARE FAILED: {type(e).__name__}: {e}")
              print("FAILED:", e)
          PYEOF
          python3 fetch.py "${{ github.event.inputs.video_id }}"
      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add transcript_output.txt
          git commit -m "Add transcript output" || echo "nothing to commit"
          git push
