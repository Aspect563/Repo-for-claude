name: Fetch YouTube Transcript

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'YouTube video ID'
        required: true
        default: '2VmjCxXBW-c'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install youtube-transcript-api "requests[socks]" PySocks
      - name: Test proxies raw
        run: |
          for p in 142.54.237.38:4145 67.201.59.70:4145 68.71.243.14:4145; do
            echo "=== Testing $p ==="
            echo "--- Plain HTTP (no TLS) via proxy ---"
            curl -s --socks5 "$p" --connect-timeout 8 -o /dev/null -w "HTTP:%{http_code} time:%{time_total}s\n" http://example.com || echo "curl failed"
            echo "--- HTTPS via proxy, verbose ---"
            curl -sv --socks5 "$p" --connect-timeout 8 https://example.com 2>&1 | grep -E "Connected|SSL|TLS|error|HTTP/" | head -10
            echo ""
          done
      - name: Fetch transcript via proxies
        run: |
          cat > fetch.py << 'PYEOF'
          from youtube_transcript_api import YouTubeTranscriptApi
          from youtube_transcript_api.proxies import GenericProxyConfig
          import sys

          vid = sys.argv[1]
          proxies = ["142.54.237.38:4145", "67.201.59.70:4145", "68.71.243.14:4145"]
          result = None
          errors = []

          for p in proxies:
              try:
                  proxy_url = f"socks5://{p}"
                  config = GenericProxyConfig(http_url=proxy_url, https_url=proxy_url)
                  api = YouTubeTranscriptApi(proxy_config=config)
                  t = api.fetch(vid)
                  result = "\n".join(s.text for s in t)
                  errors.append(f"{p}: SUCCESS")
                  break
              except Exception as e:
                  errors.append(f"{p}: {type(e).__name__}: {e}")

          if result is None:
              # also try with no proxy as final fallback, for comparison
              try:
                  api = YouTubeTranscriptApi()
                  t = api.fetch(vid)
                  result = "\n".join(s.text for s in t)
                  errors.append("no-proxy: SUCCESS")
              except Exception as e:
                  errors.append(f"no-proxy: {type(e).__name__}: {e}")

          with open("transcript_output.txt", "w") as f:
              if result:
                  f.write(result)
              else:
                  f.write("ALL ATTEMPTS FAILED:\n" + "\n".join(errors))
          print("\n".join(errors))
          PYEOF
          python3 fetch.py "${{ github.event.inputs.video_id }}"
      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add transcript_output.txt
          git commit -m "Add transcript output" || echo "nothing to commit"
          git push
